<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Kitchen Sink</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Kitchen Sink</ion-title>
    </ion-toolbar>
  </ion-header>

  <div class="page-content">
    <form [formGroup]="form" (ngSubmit)="onSubmit()">
      <section>
        <h2 class="section-title">Personal Info</h2>

        <app-input label="Full Name" placeholder="John Doe" formControlName="fullName" />

        <app-input label="Email" type="email" placeholder="john@example.com" formControlName="email" />

        <app-input label="Password" type="password" placeholder="Min. 8 characters" formControlName="password" />

        <app-input label="Age" type="number" placeholder="18" formControlName="age" />
      </section>

      <section>
        <h2 class="section-title">Profile</h2>

        <app-select
          label="Country"
          placeholder="Select a country"
          formControlName="country"
          [options]="countryOptions"
        />

        <app-text-area
          label="Bio"
          placeholder="Tell us about yourself..."
          formControlName="bio"
          [rows]="4"
          [maxlength]="200"
          [showCounter]="true"
        />
      </section>

      <section>
        <h2 class="section-title">Preferences</h2>

        <app-radio-button label="Experience Level" formControlName="level" [options]="levelOptions" />

        <app-checkbox-group label="Interests" formControlName="interests" [options]="interestOptions" />
      </section>

      <section>
        <h2 class="section-title">Agreement</h2>

        <app-checkbox placeholder="I agree to the Terms & Conditions" label="test" formControlName="terms" />

        <app-checkbox placeholder="Subscribe to newsletter" formControlName="newsletter" />

        <app-file-upload></app-file-upload>
      </section>

      <div class="submit-wrap">
        <ion-button type="submit" expand="block" [disabled]="form.invalid"> Submit </ion-button>

        <ion-button type="button" expand="block" fill="outline" (click)="onReset()"> Reset </ion-button>
      </div>

      @if (submitted) {
        <div class="debug">
          <p class="debug-title">Form Value</p>
          <pre>{{ form.value | json }}</pre>
        </div>
      }
    </form>
  </div>
</ion-content>
