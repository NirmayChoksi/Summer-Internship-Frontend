<ion-card>
  <ion-card-header>
    <ion-skeleton-text animated class="w-40 h-20"> </ion-skeleton-text>
  </ion-card-header>

  <ion-card-content>
    @for (item of [1, 2, 3]; track item) {
      <div class="py-3">
        <div class="d-flex justify-content-between">
          <div>
            <ion-skeleton-text animated class="w-50 h-20"> </ion-skeleton-text>

            <ion-skeleton-text animated class="w-25 h-16 mt-2"> </ion-skeleton-text>
          </div>

          <div>
            <ion-skeleton-text animated class="w-20 h-16"> </ion-skeleton-text>
          </div>
        </div>

        <ion-skeleton-text animated class="w-100 h-10 mt-3"> </ion-skeleton-text>

        <ion-skeleton-text animated class="w-35 h-16 mt-3"> </ion-skeleton-text>
      </div>
    }
  </ion-card-content>
</ion-card>
