<ion-card>
  <ion-card-header>
    <ion-card-title> Campaign Overview </ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <ion-grid>
      <ion-row>
        <ion-col size="6">
          <div class="metric">
            <ion-icon color="primary" name="megaphone-outline"> </ion-icon>
            <div>
              <h2>
                {{ overview().activeCampaigns }}
              </h2>
              <small> Active Campaigns </small>
            </div>
          </div>
        </ion-col>

        <ion-col size="6">
          <div class="metric">
            <ion-icon color="secondary" name="people-outline"> </ion-icon>
            <div>
              <h2>
                {{ overview().totalApplications }}
              </h2>
              <small> Applications </small>
            </div>
          </div>
        </ion-col>
      </ion-row>

      <ion-row>
        <ion-col size="6">
          <div class="metric">
            <ion-icon color="success" name="checkmark-circle-outline"> </ion-icon>
            <div>
              <h2>
                {{ overview().acceptedApplications }}
              </h2>
              <small> Accepted </small>
            </div>
          </div>
        </ion-col>

        <ion-col size="6">
          <div class="metric">
            <ion-icon color="warning" name="trophy-outline"> </ion-icon>
            <div>
              <h2>
                {{ overview().completedCampaigns }}
              </h2>
              <small> Completed </small>
            </div>
          </div>
        </ion-col>
      </ion-row>
    </ion-grid>

    <div class="acceptance mt-4">
      <div class="d-flex justify-content-between align-items-center">
        <span> Acceptance Rate </span>
        <strong> {{ acceptanceRate() }}% </strong>
      </div>

      <ion-progress-bar class="mt-2" [value]="acceptanceRate() / 100"> </ion-progress-bar>
    </div>
  </ion-card-content>
</ion-card>
