<div [class.error]="hasError()" class="form-input">
  @if (label()) {
    <ion-label>
      {{ label() }}
      @if (isRequired()) {
        <span aria-hidden="true" style="color: var(--ion-color-danger)"> *</span>
      }
    </ion-label>
  }

  <ion-list>
    @for (opt of options(); track opt.value) {
      <ion-item>
        <ion-checkbox
          (ionBlur)="onBlur()"
          (ionChange)="onCheck($event, opt.value)"
          [checked]="isChecked()(opt.value)"
          [disabled]="isDisabled()"
          [value]="opt.value"
        >
          <ion-text>{{ opt.label }}</ion-text>
        </ion-checkbox>
      </ion-item>
    }
  </ion-list>

  @if (hasError()) {
    <ion-note color="danger">
      <ion-icon name="alert-circle-outline" />
      {{ errorMessage() }}
    </ion-note>
  }
</div>
