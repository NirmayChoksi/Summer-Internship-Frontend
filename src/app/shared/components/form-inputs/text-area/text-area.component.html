<div class="form-input">
  @if (label()) {
    <ion-label>
      {{ label() }}
      @if (isRequired()) {
        <span style="color: var(--ion-color-danger)"> *</span>
      }
    </ion-label>
  }

  <ion-textarea
    (ionBlur)="onBlur()"
    (ionInput)="onInput($event)"
    [class.at-limit]="isAtLimit()"
    [class.error]="hasError()"
    [class.error]="hasError()"
    [class.near-limit]="isNearLimit()"
    [counter]="showCounter()"
    [counterFormatter]="counterFormatter"
    [disabled]="isDisabled()"
    [maxlength]="maxlength()"
    [placeholder]="placeholder()"
    [rows]="rows()"
    [value]="value()"
  />

  @if (hasError()) {
    <ion-note color="danger"><ion-icon name="alert-circle-outline" />{{ errorMessage() }}</ion-note>
  }
</div>
